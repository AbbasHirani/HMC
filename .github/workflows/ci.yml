name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Placeholders, not secrets. Every data fetch falls back to empty on
      # error, so a build without a reachable database still succeeds — it
      # just prerenders the ~24 pages that need no data instead of ~121,
      # since the DB-driven generateStaticParams return nothing. That is
      # enough to catch compile, type and prerender errors.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          ADMIN_SECRET: ci-placeholder-secret-value
          NEXT_PUBLIC_SITE_URL: https://hiranimarketingcombines.in
